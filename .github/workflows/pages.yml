# The public preview on GitHub Pages (ADR-010, #27): test, build and deploy
# the site with the content repo's core files. Not a vendored file.
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 11 * * *" # daily, to pick up changes in the content repo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the content
        uses: actions/checkout@v4
        with:
          repository: Johnesco/karaokeunderground-content
          path: work
          fetch-depth: 0 # the songlist's "Updated" date comes from its history

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same gate as locally: a failed check stops the deploy, so the preview keeps its last good version.
      - run: npm test

      - name: Build the preview
        run: node scripts/build-site.js --base /karaokeunderground/ --preview --out dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
